<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Fun Facts</title>
</head>
<body>
  <h1>Cloud Fun Facts</h1>
  <p id="fact">Click the button for a cloud fact.</p>
  <button id="generate">Generate fun fact</button>

  <script>
    const apiUrl = "PASTE_API_INVOKE_URL_HERE";

    document.getElementById("generate").addEventListener("click", async () => {
      const button = document.getElementById("generate");
      const output = document.getElementById("fact");

      button.disabled = true;
      output.textContent = "Finding a fact…";

      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}"
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "Request failed");

        output.textContent = data.enhancedFact || data.fact;
      } catch (error) {
        output.textContent = "Could not load a fact. Please try again.";
        console.error(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
